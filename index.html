<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gol Central</title>
<style>
body {
background: #0A0E27;
color: white;
font-family: Arial, sans-serif;
margin: 0;
padding: 20px;
}
.container {
max-width: 600px;
margin: 0 auto;
text-align: center;
}
h1 {
color: #FFD700;
font-size: 48px;
margin-top: 80px;
}
button {
display: block;
width: 100%;
padding: 15px;
margin: 15px 0;
background: #0F3460;
border: 2px solid #FFD700;
border-radius: 12px;
color: white;
font-size: 18px;
font-weight: bold;
cursor: pointer;
}
button:hover {
background: #16213E;
transform: scale(1.02);
}
.candado {
position: fixed;
bottom: 20px;
right: 20px;
background: #FFD700;
width: 50px;
height: 50px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 24px;
cursor: pointer;
}
.tarjeta {
background: #0F3460;
padding: 15px;
margin: 10px 0;
border-radius: 12px;
cursor: pointer;
text-align: left;
border-left: 4px solid #FFD700;
}
.tarjeta:hover {
background: #16213E;
}
.hidden {
display: none;
}
.modal {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.9);
display: flex;
align-items: center;
justify-content: center;
z-index: 100;
}
.modal-content {
background: #16213E;
padding: 30px;
border-radius: 20px;
width: 90%;
max-width: 400px;
border: 2px solid #FFD700;
}
input {
width: 100%;
padding: 12px;
margin: 10px 0;
background: #0A0E27;
border: 1px solid #FFD700;
border-radius: 8px;
color: white;
}
.btn-volver {
background: #E94560;
margin-bottom: 20px;
}
</style>
</head>
<body>

<!-- PANTALLA 1: INICIO -->
<div id="inicio" class="container">
<h1>GOL CENTRAL</h1>
<p style="margin-bottom: 40px;">Tu mundo de compras, todo en un solo lugar</p>
<button id="btnPaises">🌍 VER PAÍSES</button>
<button id="btnAcceso">🔐 ACCESO DUEÑOS</button>
<div class="candado" id="candado">🔒</div>
</div>

<!-- PANTALLA 2: PAÍSES -->
<div id="paises" class="container hidden">
<button id="volverInicio" class="btn-volver">← VOLVER</button>
<h2>🌎 PAÍSES</h2>
<div id="listaPaises"></div>
</div>

<!-- PANTALLA 3: CIUDADES -->
<div id="ciudades" class="container hidden">
<button id="volverPaises" class="btn-volver">← VOLVER</button>
<h2 id="tituloCiudades">🏙️ CIUDADES</h2>
<div id="listaCiudades"></div>
</div>

<!-- PANTALLA 4: CENTROS -->
<div id="centros" class="container hidden">
<button id="volverCiudades" class="btn-volver">← VOLVER</button>
<h2 id="tituloCentros">🏬 CENTROS COMERCIALES</h2>
<div id="listaCentros"></div>
</div>

<!-- PANTALLA 5: LOCALES -->
<div id="locales" class="container hidden">
<button id="volverCentros" class="btn-volver">← VOLVER</button>
<h2 id="tituloLocales">🏪 LOCALES</h2>
<div id="listaLocales"></div>
</div>

<!-- PANTALLA 6: PRODUCTOS -->
<div id="productos" class="container hidden">
<button id="volverLocales" class="btn-volver">← VOLVER</button>
<h2 id="tituloProductos">🛍️ PRODUCTOS</h2>
<div id="listaProductos"></div>
</div>

<!-- MODAL LOGIN -->
<div id="modal" class="hidden modal">
<div class="modal-content">
<h3 style="color:#FFD700">🔐 ACCESO</h3>
<input type="password" id="password" placeholder="Contraseña Dueño Web">
<input type="text" id="llave" placeholder="Llave del Local">
<button id="btnLogin">INGRESAR</button>
<button id="btnCerrarModal">CANCELAR</button>
</div>
</div>

<script>
// ========== DATOS ==========
const datos = {
paises: [
{ id: 1, nombre: "Paraguay", bandera: "🇵🇾", ciudades: [
{ id: 11, nombre: "9 de Julio", centros: [
{ id: 111, nombre: "Town Festival", locales: [
{ id: 1111, nombre: "Parrilla", rubro: "Restaurante", productos: [
{ nombre: "Asado", precio: 65000, descripcion: "Corte especial de carne" },
{ nombre: "Milanesa", precio: 80000, descripcion: "Napolitana con papas" }
 ]},
{ id: 1112, nombre: "Cocina", rubro: "Restaurante", productos: [
{ nombre: "Pizza", precio: 45000, descripcion: "Muzzarella y albahaca" }
 ]},
{ id: 1113, nombre: "Bebidas", rubro: "Bar", productos: [
{ nombre: "Tere'RE", precio: 15000, descripcion: "Tradicional paraguayo" }
 ]}
]}
]}
]},
{ id: 2, nombre: "Argentina", bandera: "🇦🇷", ciudades: [
{ id: 21, nombre: "Buenos Aires", centros: [
{ id: 211, nombre: "Shopping Central", locales: [] }
]}
]}
]
};

let usuario = null;
let navegacion = { pais: null, ciudad: null, centro: null, local: null };

// ========== FUNCIONES ==========
function ocultarTodo() {
document.getElementById('inicio').classList.add('hidden');
document.getElementById('paises').classList.add('hidden');
document.getElementById('ciudades').classList.add('hidden');
document.getElementById('centros').classList.add('hidden');
document.getElementById('locales').classList.add('hidden');
document.getElementById('productos').classList.add('hidden');
}

function mostrarInicio() {
ocultarTodo();
document.getElementById('inicio').classList.remove('hidden');
}

function mostrarPaises() {
ocultarTodo();
document.getElementById('paises').classList.remove('hidden');

let html = '';
for (let pais of datos.paises) {
html += <div class="tarjeta" onclick="seleccionarPais(${pais.id})">
<span style="font-size:30px;">${pais.bandera}&lt;/span&gt; &lt;h3&gt;${pais.nombre}</h3>
</div>`;
}
document.getElementById('listaPaises').innerHTML = html;
}

function seleccionarPais(paisId) {
navegacion.pais = datos.paises.find(p => p.id === paisId);
mostrarCiudades();
}

function mostrarCiudades() {
ocultarTodo();
document.getElementById('ciudades').classList.remove('hidden');
document.getElementById('tituloCiudades').innerHTML = ``${navegacion.pais.bandera} ${navegacion.pais.nombre} - Ciudades;

let html = '';
for (let ciudad of navegacion.pais.ciudades) {
html += <div class="tarjeta" onclick="seleccionarCiudad(${ciudad.id})">
<h3>🏙️ ${ciudad.nombre}&lt;/h3&gt; &lt;/div>;
}
document.getElementById('listaCiudades').innerHTML = html;
}

function seleccionarCiudad(ciudadId) {
navegacion.ciudad = navegacion.pais.ciudades.find(c => c.id === ciudadId);
mostrarCentros();
}

function mostrarCentros() {
ocultarTodo();
document.getElementById('centros').classList.remove('hidden');
document.getElementById('tituloCentros').innerHTML = ``${navegacion.ciudad.nombre} - Centros Comerciales`;

let html = '';
for (let centro of navegacion.ciudad.centros) {
html += <div class="tarjeta" onclick="seleccionarCentro(${centro.id})">
<h3>🏢 ${centro.nombre}&lt;/h3&gt; &lt;/div>;
}
document.getElementById('listaCentros').innerHTML = html;
}

function seleccionarCentro(centroId) {
navegacion.centro = navegacion.ciudad.centros.find(c => c.id === centroId);
mostrarLocales();
}

function mostrarLocales() {
ocultarTodo();
document.getElementById('locales').classList.remove('hidden');
document.getElementById('tituloLocales').innerHTML = ${navegacion.centro.nombre} - Locales`;

let html = '';
for (let local of navegacion.centro.locales) {
html += <div class="tarjeta" onclick="seleccionarLocal(${local.id})">
<h3>🏪 {local.rubro}</p>
</div>`;
}
if (html === '') html = '<p>No hay locales disponibles</p>';
document.getElementById('listaLocales').innerHTML = html;
}

function seleccionarLocal(localId) {
navegacion.local = navegacion.centro.locales.find(l => l.id === localId);
mostrarProductos();
}

function mostrarProductos() {
ocultarTodo();
document.getElementById('productos').classList.remove('hidden');
document.getElementById('tituloProductos').innerHTML = ${navegacion.local.nombre} - Productos`;

let html = '';
for (let prod of navegacion.local.productos) {
html += <div class="tarjeta"&gt; &lt;h3&gt;🍽️${prod.nombre}</h3>
<p>latex
{prod.descripcion}&lt;/p&gt; &lt;p style="color:#FFD700; font-size:20px;"&gt;Gs 

{prod.precio.toLocaleString()}</p>
</div>`;
}
document.getElementById('listaProductos').innerHTML = html;
}

// ========== LOGIN ==========
function mostrarLogin() {
document.getElementById('modal').classList.remove('hidden');
}

function cerrarLogin() {
document.getElementById('modal').classList.add('hidden');
document.getElementById('password').value = '';
document.getElementById('llave').value = '';
}

function iniciarSesion() {
const pass = document.getElementById('password').value;
const llave = document.getElementById('llave').value;

if (pass === 'Golcentral2026') {
usuario = { tipo: 'duenoweb' };
cerrarLogin();
alert('✅ Bienvenido Dueño Web');
mostrarPaises();
}
else if (llave === 'TF-001-A1B2') {
usuario = { tipo: 'duenolocal' };
cerrarLogin();
alert('✅ Bienvenido Dueño del Local - Parrilla');
// Navegar directamente al local de ejemplo
navegacion.pais = datos.paises[0];
navegacion.ciudad = navegacion.pais.ciudades[0];
navegacion.centro = navegacion.ciudad.centros[0];
navegacion.local = navegacion.centro.locales[0];
mostrarProductos();
}
else {
alert('❌ Contraseña o llave incorrecta');
}
}

// ========== EVENTOS ==========
document.getElementById('btnPaises').onclick = mostrarPaises;
document.getElementById('btnAcceso').onclick = mostrarLogin;
document.getElementById('candado').onclick = mostrarLogin;
document.getElementById('volverInicio').onclick = mostrarInicio;
document.getElementById('volverPaises').onclick = mostrarPaises;
document.getElementById('volverCiudades').onclick = mostrarCiudades;
document.getElementById('volverCentros').onclick = mostrarCentros;
document.getElementById('volverLocales').onclick = mostrarLocales;
document.getElementById('btnLogin').onclick = iniciarSesion;
document.getElementById('btnCerrarModal').onclick = cerrarLogin;

// Iniciar
mostrarInicio();
</script>
</body>
</html>
