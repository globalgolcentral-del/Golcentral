<script>
// ============ HASH ============
function hashSimple(str) {
let hash = 0;
for (let i = 0; i < str.length; i++) {
const char = str.charCodeAt(i);
hash = ((hash << 5) - hash) + char;
hash |= 0;
}
return Math.abs(hash).toString(16).padStart(8,'0')+Math.abs(hash7).toString(16).padStart(8,'0')+Math.abs(hash13).toString(16).padStart(8,'0')+Math.abs(hash*17).toString(16).padStart(8,'0');
}

const PASSWORD_HASH = hashSimple('Golcentral2026');
const RECUPERACION_HASH = hashSimple('caterine.1520');

// ============ HISTORIAL ==========
let historialCambios = [];

function agregarHistorial(accion) {
const ahora = new Date();
const fecha = ahora.toLocaleDateString('es-AR');
const hora = ahora.toLocaleTimeString('es-AR');
historialCambios.push({ fecha, hora, accion });
if (historialCambios.length > 500) historialCambios.shift();
localStorage.setItem('golcentral_historial', JSON.stringify(historialCambios));
}

function verHistorial() {
const overlay = document.getElementById('modal-overlay');
const contenido = document.getElementById('modal-contenido');
contenido.innerHTML = <h3 class="text-xl font-bold text-oro mb-4"&gt;📋 Historial de Cambios&lt;/h3&gt;&lt;div class="max-h-96 overflow-y-auto space-y-1"&gt;${historialCambios.slice().reverse().map(h => <div class="historial-item"&gt;&lt;span class="text-gray-500 text-xs"&gt;${h.fecha} {h.accion}</p></div>).join('')}&lt;/div&gt;&lt;button onclick="cerrarModal()" class="w-full text-center text-gray-400 hover:text-white mt-4 text-sm"&gt;Cerrar&lt;/button>;
overlay.style.display = 'flex';
}

// ============ GENERADOR DE LLAVES ==========
function generarLlave(centroNombre) {
const prefijo = centroNombre.substring(0, 2).toUpperCase().replace(/[^A-Z]/g, 'X');
const numero = String(Math.floor(Math.random() * 900) + 100);
const random = Math.random().toString(36).substring(2, 6).toUpperCase();
return ${prefijo}-${numero}-${random}`;
}

function llaveEsUnica(llave) {
for (let pais of datos.paises) {
for (let ciudad of pais.ciudades) {
for (let centro of ciudad.centrosComerciales) {
for (let local of centro.locales) {
if (local.llaveAcceso === llave) return false;
}
}
}
}
return true;
}

function generarLlaveUnica(centroNombre) {
let llave;
do { llave = generarLlave(centroNombre); } while (!llaveEsUnica(llave));
return llave;
}

function iniciarRotacionPublicidad(centroId) {
if (intervalosRotacion[centroId]) clearInterval(intervalosRotacion[centroId]);
const centro = obtenerCentroActual();
if (!centro || !Array.isArray(centro.publicidadSuperior)) return;
let indiceActual = 0;
mostrarPublicidadEnContenedor(centro, indiceActual);
intervalosRotacion[centroId] = setInterval(() => {
const centroActual = obtenerCentroActual();
if (!centroActual || !centroActual.publicidadSuperior) return;
let pubs = centroActual.publicidadSuperior.filter(p => p.activo !== false);
if (pubs.length === 0) pubs = centroActual.publicidadSuperior;
indiceActual = (indiceActual + 1) % pubs.length;
const indiceReal = centroActual.publicidadSuperior.findIndex(p => p.id === pubs[indiceActual].id);
mostrarPublicidadEnContenedor(centroActual, indiceReal >= 0 ? indiceReal : 0);
}, 5000);
}

{i})" class="w-2 h-2 rounded-full mx-0.5 transition-all latex
{i === indice ? 'bg-oro' : 'bg-gray-500'}"&gt;&lt;/button>`; }).join(''); contenedor.innerHTML = `<div class="relative w-full min-h-[130px] flex items-center justify-center"&gt;

{html}<div class="absolute bottom-1 left-0 right-0 flex justify-center gap-1">${indicadores}&lt;/div&gt;&lt;/div>;

function cambiarPublicidadManual(indice) {
const centro = obtenerCentroActual();
if (!centro) return;
if (intervalosRotacion[centro.id]) {
clearInterval(intervalosRotacion[centro.id]);
intervalosRotacion[centro.id] = null;
}
let indiceActual = indice;
mostrarPublicidadEnContenedor(centro, indiceActual);
intervalosRotacion[centro.id] = setInterval(() => {
const centroActual = obtenerCentroActual();
if (!centroActual || !centroActual.publicidadSuperior) return;
let pubsActivas = centroActual.publicidadSuperior.filter(p => p.activo !== false);
if (pubsActivas.length === 0) pubsActivas = centroActual.publicidadSuperior;
let nuevoIndice = (indiceActual + 1) % pubsActivas.length;
indiceActual = nuevoIndice;
const indiceReal = centroActual.publicidadSuperior.findIndex(p => p.id === pubsActivas[nuevoIndice].id);
if (indiceReal >= 0) {
mostrarPublicidadEnContenedor(centroActual, indiceReal);
}
}, 5000);
}

function renderizarPaginacionGestion(totalItems) {
const contenedor = document.getElementById('paginacion-gestion');
const totalPaginas = Math.ceil(totalItems / ITEMS_POR_PAGINA);
if (totalPaginas <= 1) { contenedor.innerHTML = ''; return; }
let html = <button onclick="cambiarPaginaGestion(${paginaActualGestion-1})" class="paginacion-btn ${paginaActualGestion===1?'desactivado':''}"&gt;← Ant&lt;/button>;
for(let i=1;i<=totalPaginas;i++) {
if(i===1||i===totalPaginas||Math.abs(i-paginaActualGestion)<=2) html+=<button onclick="cambiarPaginaGestion(${i})" class="paginacion-btn ${paginaActualGestion===i?'activo':''}"&gt;${i}</button>; else if(i===2&&paginaActualGestion&gt;4) html+=<span class="text-gray-500 px-2">...</span>; } html+=<button onclick="cambiarPaginaGestion(${paginaActualGestion+1})" class="paginacion-btn ${paginaActualGestion>=totalPaginas?'desactivado':''}">Sig →</button>`;
contenedor.innerHTML = html;
}

function cambiarPaginaGestion(pagina) {
const todosLocales = obtenerTodosLocales();
const totalPaginas = Math.ceil(todosLocales.length / ITEMS_POR_PAGINA);
if(pagina<1||pagina>totalPaginas) return;
paginaActualGestion = pagina;
renderizarGestionLlaves();
}

function encontrarLocal(paisId, ciudadId, centroId, localId) {

function generarInforme() {
let totalPaises=datos.paises.length, totalCiudades=0, totalCentros=0, totalLocales=0, localesPremium=0, localesEstandar=0;
let localesAlDia=[], localesDeuda=[], localesBloqueados=[], localesVacantes=[], vencimientosProximos=[];
const hoy = new Date(); hoy.setHours(0,0,0,0);
const en30Dias = new Date(hoy); en30Dias.setDate(en30Dias.getDate()+30);
datos.paises.forEach(pais => { pais.ciudades.forEach(ciudad => { totalCiudades++; ciudad.centrosComerciales.forEach(centro => { totalCentros++; centro.locales.forEach(local => {
totalLocales++;
const info = { nombre: local.nombre, dueño: local.nombreDueño||'Sin dueño', llave: local.llaveAcceso||'Sin llave', categoria: local.categoria, estado: local.estadoAlquiler, centro: centro.nombre, ciudad: ciudad.nombre, pais: pais.nombre, fechaVencimiento: local.fechaVencimiento };
if (local.categoria === 'PREMIUM') localesPremium++; else localesEstandar++;
switch(local.estadoAlquiler) { case 'AL_DIA': localesAlDia.push(info); break; case 'DEUDA': localesDeuda.push(info); break; case 'BLOQUEADO': localesBloqueados.push(info); break; case 'VACANTE': localesVacantes.push(info); break; }
