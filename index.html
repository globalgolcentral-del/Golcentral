// ============ HASH ============
function hashSimple(str) {
let hash = 0;
for (let i = 0; i < str.length; i++) {
const char = str.charCodeAt(i);
hash = ((hash << 5) - hash) + char;
hash |= 0;
}
return Math.abs(hash).toString(16).padStart(8, '0') + Math.abs(hash * 7).toString(16).padStart(8, '0') + Math.abs(hash * 13).toString(16).padStart(8, '0') + Math.abs(hash * 17).toString(16).padStart(8, '0');
}

if (historialCambios.length > 500) historialCambios.shift();
localStorage.setItem('golcentral_historial', JSON.stringify(historialCambios));
}

</div>

// ============ GENERADOR DE LLAVES ============
function generarLlave(centroNombre) {
const prefijo = centroNombre.substring(0, 2).toUpperCase().replace(/[^A-Z]/g, 'X');
const numero = String(Math.floor(Math.random() * 900) + 100);
const random = Math.random().toString(36).substring(2, 6).toUpperCase();
return ${prefijo}-${numero}-${random}`;
}

function llaveEsUnica(llave) {
for (let pais of datos.paises) {
for (let ciudad of pais.ciudades) {
for (let centro of ciudad.centrosComerciales) {
for (let local of centro.locales) {
if (local.llaveAcceso === llave) return false;
}
}
}
}
return true;
}

function generarLlaveUnica(centroNombre) {
let llave;
do { llave = generarLlave(centroNombre); } while (!llaveEsUnica(llave));
return llave;
}

function guardarDatos() {
localStorage.setItem('golcentral_datos', JSON.stringify(datos));
localStorage.setItem('golcentral_historial', JSON.stringify(historialCambios));
actualizarInfoGuardado();
}

function cargarDatos() {
const guardado = localStorage.getItem('golcentral_datos');
const histGuardado = localStorage.getItem('golcentral_historial');
if (histGuardado) {
try { historialCambios = JSON.parse(histGuardado); } catch(e) {}
}
if (guardado) {
try { datos = JSON.parse(guardado); return true; } catch(e) { return false; }
}
return false;
}

function actualizarInfoGuardado() {
const info = document.getElementById('datos-guardados-info');
if (localStorage.getItem('golcentral_datos')) {
info.textContent = '💾 Datos guardados en este dispositivo';
} else {
info.textContent = '';
}
}

function restablecerDatos() {
if (confirm('¿Estás seguro? Se borrarán todos los cambios y volverás a los datos iniciales.')) {
datos = JSON.parse(JSON.stringify(DATOS_INICIALES));
historialCambios = [];
guardarDatos();
agregarHistorial('🔄 Datos restablecidos a valores iniciales');
toast('✅ Datos restablecidos correctamente', 'success');
volverAInicio();
}
}

function exportarDatos() {
const blob = new Blob([JSON.stringify({ datos, historial: historialCambios }, null, 2)], {type: 'application/json'});
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url; a.download = 'golcentral_backup_' + new Date().toISOString().split('T')[0] + '.json'; a.click();
URL.revokeObjectURL(url);
toast('✅ Datos exportados correctamente', 'success');
}

function importarDatos() {
const input = document.createElement('input');
input.type = 'file'; input.accept = '.json';
input.onchange = function(e) {
const file = e.target.files[0];
const reader = new FileReader();
reader.onload = function(event) {
try {
const importado = JSON.parse(event.target.result);
if (importado.datos && importado.datos.paises) {
datos = importado.datos;
if (importado.historial) historialCambios = importado.historial;
guardarDatos();
toast('✅ Datos importados correctamente', 'success');
volverAInicio();
} else { toast('❌ Archivo inválido', 'error'); }
} catch(e) { toast('❌ Error al leer el archivo', 'error'); }
};
reader.readAsText(file);
};
input.click();
}

// ============ HELPERS ============
function obtenerPaisActual() { return datos.paises.find(p => p.id === navegacionActual.paisId); }
function obtenerCiudadActual() { const p = obtenerPaisActual(); return p ? p.ciudades.find(c => c.id === navegacionActual.ciudadId) : null; }
function obtenerCentroActual() { const c = obtenerCiudadActual(); return c ? c.centrosComerciales.find(cc => cc.id === navegacionActual.centroId) : null; }
function obtenerLocalActual() { const cc = obtenerCentroActual(); return cc ? cc.locales.find(l => l.id === navegacionActual.localId) : null; }

function formatearPrecio(precio) {
return '$` ' + precio.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function ordenarAlfabeticamente(arr, campo = 'nombre') {
return [...arr].sort((a, b) => (a[campo] || '').localeCompare(b[campo] || '', 'es'));
}

function calcularEstadoVencimiento(fecha) {
const hoy = new Date(); hoy.setHours(0,0,0,0);
const venc = new Date(fecha + 'T00:00:00');
const diff = Math.ceil((venc - hoy) / (10006060*24));
if (diff < 0) return { texto: '🚨 ¡VENCIDO! (' + Math.abs(diff) + ' días)', clase: 'text-red-400 font-bold' };
if (diff === 0) return { texto: '⚠️ VENCE HOY', clase: 'text-yellow-400 font-bold' };
if (diff <= 7) return { texto: '⚠️ Vence en ' + diff + ' días', clase: 'text-yellow-400' };
if (diff <= 30) return { texto: '📅 Vence en ' + diff + ' días', clase: 'text-gray-400' };
return { texto: '📅 ' + venc.toLocaleDateString('es-AR'), clase: 'text-gray-500' };
}

datos.paises.forEach(pais => {

if (local.nombre.toLowerCase().includes(termino) ||
local.nombreDueño.toLowerCase().includes(termino) ||
local.llaveAcceso.toLowerCase().includes(termino) ||
local.rubro.toLowerCase().includes(termino) ||
centro.nombre.toLowerCase().includes(termino) ||
ciudad.nombre.toLowerCase().includes(termino) ||
pais.nombre.toLowerCase().includes(termino)) {

function renderizarFiltrosLocales() {
const contenedor = document.getElementById('filtros-locales');
const filtros = ['TODOS', 'AL_DIA', 'DEUDA', 'BLOQUEADO', 'VACANTE', 'PREMIUM', 'ESTANDAR', 'VENCIDOS'];
const nombres = { 'TODOS': 'Todos', 'AL_DIA': '✅ Al Día', 'DEUDA': '⚠️ Deuda', 'BLOQUEADO': '🔴 Bloqueado', 'VACANTE': '⚪ Vacante', 'PREMIUM': '⭐ Premium', 'ESTANDAR': '📋 Estándar', 'VENCIDOS': '🚨 Vencidos' };

contenedor.innerHTML = filtros.map(f => &lt;button onclick="cambiarFiltroLocales('${f}')" class="filtro-btn ${filtroActualLocales === f ? 'activo' : ''}"&gt;${nombres[f]}</button>
`).join('');
}

function cambiarFiltroLocales(filtro) {
filtroActualLocales = filtro;
paginaActualLocales = 1;
renderizarFiltrosLocales();
renderizarLocales();
}

function obtenerLocalesFiltrados() {
const centro = obtenerCentroActual();
if (!centro) return [];

let locales = [...centro.locales];

switch(filtroActualLocales) {
case 'AL_DIA': locales = locales.filter(l => l.estadoAlquiler === 'AL_DIA'); break;
case 'DEUDA': locales = locales.filter(l => l.estadoAlquiler === 'DEUDA'); break;
case 'BLOQUEADO': locales = locales.filter(l => l.estadoAlquiler === 'BLOQUEADO'); break;
case 'VACANTE': locales = locales.filter(l => l.estadoAlquiler === 'VACANTE'); break;
case 'PREMIUM': locales = locales.filter(l => l.categoria === 'PREMIUM'); break;
case 'ESTANDAR': locales = locales.filter(l => l.categoria === 'ESTANDAR'); break;
case 'VENCIDOS':
const hoy = new Date(); hoy.setHours(0,0,0,0);
locales = locales.filter(l => l.fechaVencimiento && new Date(l.fechaVencimiento + 'T00:00:00') <= hoy);
break;
}

return ordenarAlfabeticamente(locales);
}

function renderizarPaginacionLocales(totalItems) {
const contenedor = document.getElementById('paginacion-locales');
const totalPaginas = Math.ceil(totalItems / ITEMS_POR_PAGINA);
if (totalPaginas <= 1) { contenedor.innerHTML = ''; return; }

let html = <button onclick="cambiarPaginaLocales(${paginaActualLocales - 1})" class="paginacion-btn latex
{paginaActualLocales === 1 ? 'desactivado' : ''}"&gt;← Ant&lt;/button>`; for (let i = 1; i &lt;= totalPaginas; i++) { if (i === 1 || i === totalPaginas || Math.abs(i - paginaActualLocales) &lt;= 2) { html += `<button onclick="cambiarPaginaLocales(

{i})" class="paginacion-btn {i}</button>; } else if (i === 2 && paginaActualLocales &gt; 4) { html +=<span class="text-gray-500 px-2">...</span>; } } html +=<button onclick="cambiarPaginaLocales({paginaActualLocales >= totalPaginas ? 'desactivado' : ''}">Sig →</button>`;
contenedor.innerHTML = html;
}

function cambiarPaginaLocales(pagina) {
const centro = obtenerCentroActual();
if (!centro) return;
const localesFiltrados = obtenerLocalesFiltrados();
const totalPaginas = Math.ceil(localesFiltrados.length / ITEMS_POR_PAGINA);
if (pagina < 1 || pagina > totalPaginas) return;
paginaActualLocales = pagina;
renderizarLocales();
}

const estandar = paginaLocales.filter(l => l.categoria === 'ESTANDAR');

function tarjetaLocal(local) {
const bloqueado = local.estadoAlquiler === 'BLOQUEADO';
const esDueño = usuarioActual && usuarioActual.tipo === 'duenoweb';

datos.paises.forEach(pais => {

centro.locales.forEach(local => {

});

});

switch(filtroActualGestion) {

case 'DEUDA': todos = todos.filter(l => l.estadoAlquiler === 'DEUDA'); break;
case 'BLOQUEADO': todos = todos.filter(l => l.estadoAlquiler === 'BLOQUEADO'); break;
case 'VACANTE': todos = todos.filter(l => l.estadoAlquiler === 'VACANTE'); break;
case 'PREMIUM': todos = todos.filter(l => l.categoria === 'PREMIUM'); break;

case 'VENCIDOS':

function copiarInforme() {
const texto = document.getElementById('texto-informe').innerText;
const btn = document.getElementById('btn-copiar-informe');
navigator.clipboard.writeText(texto).then(() => {
btn.textContent = '✅ ¡COPIADO!';
btn.classList.add('copiado');
setTimeout(() => { btn.textContent = '📋 COPIAR INFORME COMPLETO'; btn.classList.remove('copiado'); }, 3000);
}).catch(() => {
const textarea = document.createElement('textarea');
textarea.value = texto;
document.body.appendChild(textarea);
textarea.select();
document.execCommand('copy');
document.body.removeChild(textarea);
btn.textContent = '✅ ¡COPIADO!';
btn.classList.add('copiado');
setTimeout(() => { btn.textContent = '📋 COPIAR INFORME COMPLETO'; btn.classList.remove('copiado'); }, 3000);
});
}
