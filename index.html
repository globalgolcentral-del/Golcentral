<!DOCTYPE html>
<html>
<head>
<title>Prueba Gol Central</title>
<style>
body {
background: #0A0E27;
color: white;
font-family: Arial;
padding: 50px;
text-align: center;
}
button {
background: #FFD700;
color: #0A0E27;
padding: 15px 30px;
font-size: 18px;
margin: 10px;
border: none;
border-radius: 10px;
cursor: pointer;
font-weight: bold;
}
button:hover { background: #FFC000; }
.tarjeta {
background: #0F3460;
padding: 15px;
margin: 10px;
border-radius: 10px;
cursor: pointer;
border-left: 4px solid #FFD700;
}
.hidden { display: none; }
</style>
</head>
<body>

<!-- PANTALLA INICIO -->
<div id="inicio">
<h1 style="color:#FFD700;">GOL CENTRAL</h1>
<button onclick="testPaises()">🌍 VER PAÍSES</button>
<button onclick="testAcceso()">🔐 ACCESO DUEÑOS</button>
<button onclick="testAlert()">🔧 TEST (CLICK AQUÍ)</button>
</div>

<!-- PANTALLA PAÍSES -->
<div id="paises" class="hidden">
<button onclick="volverInicio()">← VOLVER</button>
<h2>🌎 PAÍSES</h2>
<div id="listaPaises"></div>
</div>

<script>
// Función de prueba para ver si los clicks funcionan
function testAlert() {
alert("✅ ¡EL BOTÓN FUNCIONA! El JavaScript está ejecutándose correctamente.");
}

function testPaises() {
alert("✅ Abriendo países...");
document.getElementById('inicio').classList.add('hidden');
document.getElementById('paises').classList.remove('hidden');

// Datos simples
const paises = [
{ nombre: "Paraguay", bandera: "🇵🇾" },
{ nombre: "Argentina", bandera: "🇦🇷" }
 ];

let html = '';
for(let p of paises) {
html += <div class="tarjeta" onclick="alert('Hiciste clic en ${p.nombre}')">
<span style="font-size:30px;">${p.bandera}&lt;/span&gt; &lt;h3&gt;${p.nombre}&lt;/h3&gt; &lt;/div>;
}
document.getElementById('listaPaises').innerHTML = html;
}

function testAcceso() {
const pass = prompt("Ingrese la contraseña del Dueño Web:");
if (pass === "Golcentral2026") {
alert("✅ Acceso concedido. Bienvenido Dueño Web!");
} else {
alert("❌ Contraseña incorrecta");
}
}

function volverInicio() {
document.getElementById('paises').classList.add('hidden');
document.getElementById('inicio').classList.remove('hidden');
}
</script>

</body>
</html>
