<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Gol Central - Centro Comercial Virtual (Completo)</title>

        .text-oro { color: #f9b800; }
        .border-oro { border-color: #f9b800; }
        .bg-oro { background: #f9b800; }
        .btn-oro { background: linear-gradient(135deg, #f9b800, #e0a800); color: #000; font-weight: bold; transition: 0.2s; box-shadow: 0 4px 15px rgba(249,184,0,0.3); }

        .card-premium { background: linear-gradient(135deg, #1a1a3e, #0a0a2a); border: 2px solid #f9b800; border-radius: 1.5rem; padding: 1rem; transition: 0.2s; cursor: pointer; position: relative; overflow: hidden; }
        .card-premium:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(249,184,0,0.3); }
        .card-estandar { background: #1a1a1a; border: 1px solid #0057b8; border-radius: 1rem; padding: 0.75rem; transition: 0.2s; cursor: pointer; position: relative; overflow: hidden; }
        .card-estandar:hover { transform: scale(1.02); border-color: #f9b800; }
        .estado-al-dia { background: #00c853; color: black; border-radius: 9999px; padding: 2px 12px; font-size: 0.7rem; font-weight: bold; display: inline-block; }
        .estado-deuda { background: #ffa000; color: black; border-radius: 9999px; padding: 2px 12px; font-size: 0.7rem; }
        .estado-vacante { background: #6b7280; color: white; border-radius: 9999px; padding: 2px 12px; font-size: 0.7rem; }
        .estado-bloqueado { background: #dc2626; color: white; border-radius: 9999px; padding: 2px 12px; font-size: 0.7rem; }
        .abierto { background: #00c853; color: black; border-radius: 9999px; padding: 2px 12px; font-size: 0.7rem; display: inline-block; }
        .cerrado { background: #dc2626; color: white; border-radius: 9999px; padding: 2px 12px; font-size: 0.7rem; }
        .badge-categoria { background: rgba(249,184,0,0.2); color: #f9b800; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; }
        .img-cover { width: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #1e293b; border-radius: 12px; }
        .img-cover img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s; cursor: pointer; }
        .img-cover img:hover { transform: scale(1.02); }
        .country-img { height: 90px; }
        .city-img { height: 100px; }
        .mall-img { height: 120px; }
        .store-img { height: 140px; }
        .product-img { height: 140px; }
        .pub-container { width: 100%; height: 160px; overflow: hidden; background: #1e293b; border-radius: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .pub-container img { width: 100%; height: 100%; object-fit: cover; }
        .pub-container .pub-text { text-align: center; padding: 1rem; cursor: default; }
        .filtro-btn { background: #2d2d2d; border: 1px solid #555; color: #ccc; padding: 4px 12px; border-radius: 20px; cursor: pointer; }
        .filtro-btn.activo { background: #f9b800; color: black; }
        .paginacion-btn { background: #2d2d2d; border: 1px solid #f9b800; color: white; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
        .paginacion-btn.activo { background: #f9b800; color: black; }
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-contenido { background: #1a1a1a; border: 2px solid #f9b800; border-radius: 1.5rem; padding: 1.5rem; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1f1f1f; border: 2px solid #f9b800; border-radius: 12px; padding: 12px 24px; opacity: 0; transition: opacity 0.3s; z-index: 2000; pointer-events: none; white-space: nowrap; }
        .toast.show { opacity: 1; }
        .grid-premium { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; }
        .grid-estandar { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.75rem; }

        .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(251, 191, 36, 0.2); border-color: rgba(251, 191, 36, 0.5); }
        .edit-btn, .delete-btn { position: absolute; top: 8px; background: rgba(0,0,0,0.7); color: white; border-radius: 9999px; padding: 4px 8px; font-size: 12px; cursor: pointer; opacity: 0.9; transition: 0.2s; z-index: 10; }
        .edit-btn { right: 40px; background: #2563eb; }
        .delete-btn { right: 8px; background: #dc2626; }
        .edit-btn:hover, .delete-btn:hover { opacity: 1; transform: scale(1.05); }
        .admin-toolbar { background: #1e293b; border-bottom: 1px solid #f9b800; padding: 6px 12px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; position: sticky; top: 60px; z-index: 40; }
        .admin-toolbar button { background: #334155; color: white; border-radius: 20px; padding: 4px 12px; font-size: 0.75rem; transition: 0.2s; }
        .admin-toolbar button:hover { background: #f9b800; color: black; }
        .cart-sidebar { position: fixed; right: 0; top: 80px; width: 340px; max-width: 90vw; background: #1a1a1a; border-left: 3px solid #f9b800; border-radius: 12px 0 0 12px; box-shadow: -5px 0 25px rgba(0,0,0,0.8); z-index: 110; transition: 0.3s; transform: translateX(100%); padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; max-height: calc(100vh - 80px); overflow-y: auto; }

<div id="toast" class="toast"></div>
<div id="lightbox" class="lightbox" onclick="cerrarLightbox()"><img id="lightboxImg" src=""></div>

<header class="glass sticky top-0 z-50 border-b border-oro/20 px-4 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" onclick="volverAInicio()">

            <div><h1 class="text-xl md:text-2xl font-extrabold text-oro">GLOBAL</h1><p class="text-xs text-slate-400 -mt-1">GOLCENTRAL</p></div>
        </div>
        <div class="flex items-center gap-2 md:gap-4">
            <button onclick="volverAInicio()" class="hidden sm:flex items-center gap-1 text-slate-300 hover:text-oro transition px-3 py-1.5 rounded-lg hover:bg-slate-700/50 text-sm"><i class="fas fa-home"></i> <span>Inicio</span></button>
            <button id="btnLoginTop" onclick="mostrarModalLogin()" class="flex items-center gap-1 text-slate-300 hover:text-oro transition px-3 py-1.5 rounded-lg hover:bg-slate-700/50 text-sm"><i class="fas fa-key"></i> <span class="hidden sm:inline">Acceder</span></button>
            <span id="userBadge" class="hidden text-xs bg-oro/20 text-oro px-3 py-1 rounded-full font-semibold"></span>
            <button id="btnLogout" onclick="cerrarSesion()" class="hidden text-red-400 hover:text-red-300 transition px-2 py-1 rounded-lg hover:bg-red-900/30 text-sm"><i class="fas fa-sign-out-alt"></i></button>
            <button id="cartIcon" class="relative text-oro hover:text-oro/80 transition text-xl hidden" onclick="toggleCart()"><i class="fas fa-shopping-cart"></i><span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span></button>
        </div>
    </div>
</header>

<div id="adminToolbar" class="admin-toolbar hidden">
    <button onclick="mostrarGestionLlaves()"><i class="fas fa-key"></i> Gestión de Llaves</button>
    <button onclick="mostrarGestionPublicidades()"><i class="fas fa-ad"></i> Publicidades</button>
    <button onclick="generarInformeMASA()"><i class="fas fa-chart-line"></i> Informe MASA</button>
    <button onclick="exportarDatos()"><i class="fas fa-download"></i> Exportar</button>
    <button onclick="document.getElementById('inputImport').click()"><i class="fas fa-upload"></i> Importar</button>
    <input type="file" id="inputImport" accept=".json" class="hidden" onchange="importarDatos(event)">
    <button onclick="restablecerDatos()"><i class="fas fa-trash-restore"></i> Restablecer</button>
    <button onclick="verHistorial()"><i class="fas fa-history"></i> Historial</button>
    <button onclick="configurarWhatsApp()"><i class="fab fa-whatsapp"></i> WhatsApp</button>
</div>

<main id="mainContent" class="flex-1 max-w-7xl mx-auto w-full px-3 md:px-6 py-6"></main>

<footer class="border-t border-slate-700/50 py-4 px-4 text-center text-xs text-slate-500">
    <p>© 2026 Global Golcentral · Todos los derechos reservados · <span class="text-oro">Paraguay & Argentina</span></p>
</footer>

<!-- Carrito lateral -->
<div id="cartSidebar" class="cart-sidebar">

    <div id="cartItemsList"></div>
    <div class="border-t border-slate-600 pt-2"><p>Total: <span id="cartTotal" class="text-oro font-bold">Gs 0</span></p></div>

    <div><input type="text" id="cartDireccion" placeholder="Dirección" class="w-full bg-slate-700 rounded p-2 text-sm"></div>
    <div><input type="tel" id="cartTelefono" placeholder="Teléfono" class="w-full bg-slate-700 rounded p-2 text-sm"></div>
    <button onclick="enviarPedidoWhatsApp()" class="btn-oro w-full py-2 rounded-xl text-sm"><i class="fab fa-whatsapp"></i> Enviar pedido</button>
</div>

<!-- MODALES -->
<div id="modalLogin" class="modal-overlay" onclick="cerrarModalSiFondo(event, 'modalLogin')">
    <div class="glass rounded-2xl p-6 w-full max-w-md mx-4 shadow-2xl border-oro/30" onclick="event.stopPropagation()">
        <h3 class="text-xl font-bold text-oro mb-4"><i class="fas fa-lock mr-2"></i>Acceder al Sistema</h3>
        <div class="space-y-4">
            <div><label class="block text-sm font-medium text-slate-300 mb-1">Tipo de acceso</label>
                <select id="loginTipo" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2.5 text-white focus:border-oro outline-none" onchange="toggleLoginFields()">
                    <option value="owner" selected>Dueño de Local (Llave)</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>
            <div id="loginPassGroup" class="hidden"><label class="block text-sm font-medium text-slate-300 mb-1">Contraseña</label><input type="password" id="loginPassword" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2.5 text-white"></div>
            <div id="loginKeyGroup"><label class="block text-sm font-medium text-slate-300 mb-1">Llave del Local (ej: 12345678/townfestival)</label><input type="text" id="loginKey" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2.5 text-white font-mono"></div>
            <button onclick="procesarLogin()" class="btn-oro w-full py-3 rounded-xl text-lg"><i class="fas fa-arrow-right-to-bracket mr-2"></i> Ingresar</button>
            <p id="loginError" class="text-red-400 text-sm hidden text-center"></p>
        </div>
        <button onclick="cerrarModal('modalLogin')" class="absolute top-3 right-3 text-slate-400 hover:text-white text-xl"><i class="fas fa-times"></i></button>
    </div>
</div>

<div id="modalCRUD" class="modal-overlay" onclick="cerrarModalSiFondo(event, 'modalCRUD')">
    <div class="modal-contenido" onclick="event.stopPropagation()" id="modalCRUDContent"></div>
</div>

<div id="modalConfirm" class="modal-overlay" onclick="cerrarModalSiFondo(event, 'modalConfirm')">
    <div class="glass rounded-2xl p-6 w-full max-w-sm mx-4 shadow-2xl border-red-500/30 text-center" onclick="event.stopPropagation()">
        <i class="fas fa-exclamation-triangle text-5xl text-yellow-400 mb-3"></i>
        <p id="confirmMsg" class="text-white mb-4"></p>
        <div class="flex gap-3 justify-center">
            <button onclick="ejecutarConfirmacion()" class="btn-oro px-6 py-2 rounded-xl">Sí, confirmar</button>
            <button onclick="cerrarModal('modalConfirm')" class="bg-slate-600 text-white px-6 py-2 rounded-xl hover:bg-slate-500 transition">Cancelar</button>
        </div>
    </div>
</div>

function actualizarCarritoUI() {

function modificarCantidad(pid, delta) { let idx = cart.findIndex(i => i.productId === pid); if(idx!==-1) { cart[idx].cantidad += delta; if(cart[idx].cantidad<=0) cart.splice(idx,1); actualizarCarritoUI(); guardarCarrito(); } }

function agregarAlCarrito(product) { let existing = cart.find(i=>i.productId===product.id); if(existing) existing.cantidad++; else cart.push({ productId: product.id, productName: product.nombre, price: product.precio, cantidad: 1 }); actualizarCarritoUI(); guardarCarrito(); toast('✅ Producto agregado'); }

function generarLlaveUnica(centroNombre, documento) {
    let nombreNorm = centroNombre.toLowerCase().replace(/\s/g,'').replace(/[^a-z0-9]/g,'');
    let llave = `${documento}/${nombreNorm}`;
    let cont = 1;
    while(true) {
        let existe = false;
        for(let p of datos.paises) for(let c of p.ciudades) for(let ce of c.centros) for(let l of ce.locales) if(l.llave === llave) { existe = true; break; }
        if(!existe) break;
        llave = `${documento}/${nombreNorm}_${cont++}`;
    }
    return llave;
}

}
function renderizarListaLocales() {
    const centro = obtenerCentroActual(); if (!centro) return;
    let locales = [...centro.locales];
    if (!usuarioActual) locales = locales.filter(l => l.estado === 'AL_DIA' || l.estado === 'VACANTE');
    if (filtroLocales === 'PREMIUM') locales = locales.filter(l => l.categoria === 'PREMIUM');
    if (filtroLocales === 'ESTANDAR') locales = locales.filter(l => l.categoria === 'ESTANDAR');
    if (filtroLocales === 'AL_DIA') locales = locales.filter(l => l.estado === 'AL_DIA');
    if (filtroLocales === 'DEUDA') locales = locales.filter(l => l.estado === 'DEUDA');
    if (filtroLocales === 'VACANTE') locales = locales.filter(l => l.estado === 'VACANTE');
    if (filtroLocales === 'VENCIDOS') { let hoy = new Date(); hoy.setHours(0,0,0,0); locales = locales.filter(l => l.fechaVencimiento && new Date(l.fechaVencimiento+'T00:00:00') <= hoy); }
    const inicio = (paginaLocales-1)*ITEMS_POR_PAGINA;
    const pagina = locales.slice(inicio, inicio+ITEMS_POR_PAGINA);
    const premium = pagina.filter(l => l.categoria === 'PREMIUM');
    const estandar = pagina.filter(l => l.categoria === 'ESTANDAR');
    let html = '';
    if (premium.length) html += `<h3 class="text-oro text-xl font-bold mt-4 mb-3">✨ LOCALES PREMIUM</h3><div class="grid-premium">${premium.map(l => tarjetaLocalHtml(l, true)).join('')}</div>`;
    if (estandar.length) html += `<h3 class="text-slate-400 text-lg font-bold mt-6 mb-3">🏪 LOCALES ESTÁNDAR</h3><div class="grid-estandar">${estandar.map(l => tarjetaLocalHtml(l, false)).join('')}</div>`;
    if (!premium.length && !estandar.length) html = '<p class="text-center py-8">No hay locales con este filtro</p>';
    document.getElementById('lista-locales').innerHTML = html;
    const totalPag = Math.ceil(locales.length/ITEMS_POR_PAGINA);
    let pagHtml = '';
    if (totalPag>1) {
        pagHtml += `<button class="paginacion-btn" onclick="cambiarPaginaLocales(${paginaLocales-1})" ${paginaLocales===1?'disabled':''}>←</button>`;
        for(let i=1;i<=totalPag;i++) if(i===1||i===totalPag||Math.abs(i-paginaLocales)<=2) pagHtml += `<button class="paginacion-btn ${paginaLocales===i?'activo':''}" onclick="cambiarPaginaLocales(${i})">${i}</button>`;
        pagHtml += `<button class="paginacion-btn" onclick="cambiarPaginaLocales(${paginaLocales+1})" ${paginaLocales===totalPag?'disabled':''}>→</button>`;
    }
    document.getElementById('paginacion-locales').innerHTML = pagHtml;
}
function tarjetaLocalHtml(l, isPremium) {

        <h4 class="font-bold mt-2 text-center">${l.nombre}</h4>
        <p class="text-slate-400 text-center text-sm">${l.rubro}</p>
        <div class="flex justify-center gap-2 mt-1 flex-wrap">${estadoBadge}</div>
        ${puedeVerContador ? `<p class="text-oro text-xs text-center mt-1">👁 ${getVisitasHoy(l)} hoy</p>` : ''}

// ======================== PUBLICIDAD ROTATIVA (completa) ========================
function iniciarRotacionPublicidad() {
    let centro = obtenerCentroActual(); if (!centro) return;
    if (intervalosRotacion[centro.id]) clearInterval(intervalosRotacion[centro.id]);
    let idx = 0;
    function mostrar() {
        let pub = centro.publicidad[idx % centro.publicidad.length];
        let container = document.getElementById('pubContainer');
        if (!container) return;
        if (pub.tipo === 'imagen' && pub.imagen) {
            container.innerHTML = `<a href="#" onclick="abrirEnlacePublicidad('${pub.enlace}'); return false;"><img src="${pub.imagen}" style="width:100%; height:100%; object-fit:cover;"></a>`;
        } else {
            container.innerHTML = `<div class="pub-text"><i class="fas fa-bullhorn text-4xl text-oro mb-2"></i><p class="text-oro font-bold">${pub.textoAlt}</p></div>`;
        }
    }
    mostrar();
    if (rotacionActiva) intervalosRotacion[centro.id] = setInterval(() => { idx = (idx+1) % centro.publicidad.length; mostrar(); }, 5000);
}
function abrirEnlacePublicidad(enlace) {
    if (!enlace) return;
    if (enlace.match(/^https?:\/\//i) || enlace.match(/^wa\.me/i) || enlace.match(/^\+?\d+/)) {
        let url = enlace;
        if (enlace.match(/^\+?\d+$/)) url = `https://wa.me/${enlace.replace(/[^0-9]/g,'')}`;
        window.open(url, '_blank');
    } else {
        toast('Enlace no válido');
    }
}
function cambiarPublicidadManual(idx) {
    let centro = obtenerCentroActual(); if(!centro) return;
    if(intervalosRotacion[centro.id]) clearInterval(intervalosRotacion[centro.id]);
    rotacionActiva = false; localStorage.setItem('rotacionActiva','false');
    let pub = centro.publicidad[idx];
    let container = document.getElementById('pubContainer');
    if (container) {
        if (pub.tipo === 'imagen' && pub.imagen) container.innerHTML = `<a href="#" onclick="abrirEnlacePublicidad('${pub.enlace}'); return false;"><img src="${pub.imagen}" style="width:100%; height:100%; object-fit:cover;"></a>`;
        else container.innerHTML = `<div class="pub-text"><i class="fas fa-bullhorn text-4xl text-oro mb-2"></i><p class="text-oro font-bold">${pub.textoAlt}</p></div>`;
    }
}

function subirImagenPublicidad(i) { let file = document.getElementById(`pub-imagen-file-${i}`).files[0]; if(file) convertirImagenABase64(file, (base64) => { document.getElementById(`pub-imagen-url-${i}`).value = base64; toast('Imagen cargada'); }); }

function abrirModalCambiarLlave(paisId, ciudadId, centroId, localId) {

function cambiarLlaveLocal(paisId, ciudadId, centroId, localId) {
    let p = datos.paises.find(p => p.id === paisId);
    let c = p.ciudades.find(c => c.id === ciudadId);
    let ce = c.centros.find(ce => ce.id === centroId);
    let l = ce.locales.find(l => l.id === localId);
    if (!l) return;
    let doc = document.getElementById('nuevoDocumento').value.trim();
    let dueño = document.getElementById('nuevoDueño').value.trim();
    if (!doc) { toast('Documento requerido'); return; }
    let nuevaLlave = generarLlaveUnica(ce.nombre, doc);
    l.llave = nuevaLlave;
    l.dueño = dueño;
    l.estado = 'AL_DIA';
    guardarDatos();
    agregarHistorial(`Llave regenerada para ${l.nombre}`);
    toast(`Nueva llave: ${nuevaLlave}`);

function verHistorial() {
    let hist = historialCambios.slice().reverse().slice(0,50).map(h => `<div class="text-xs border-b border-slate-700 py-1">${h.fecha} ${h.hora} - ${h.accion}</div>`).join('');

function configurarWhatsApp() {
    let nuevo = prompt('Número WhatsApp (código país):', numeroWhatsAppAdmin);
    if (nuevo) { numeroWhatsAppAdmin = nuevo; localStorage.setItem('whatsapp_admin', nuevo); toast('✅ Actualizado'); }
}
function generarInformeMASA() {
    let totalCentros=0, totalLocales=0, alDia=0, deuda=0, premium=0, estandar=0, ingresos=0;
    for(let p of datos.paises) for(let c of p.ciudades) for(let ce of c.centros) {
        totalCentros++;
        for(let l of ce.locales) {
            totalLocales++;
            if(l.estado === 'AL_DIA') { alDia++; ingresos += l.categoria==='PREMIUM'?50000:25000; }
            if(l.estado === 'DEUDA') deuda++;
            if(l.categoria === 'PREMIUM') premium++;
            else estandar++;
        }
    }
    let informe = { fecha: new Date().toISOString(), resumen: { totalCentros, totalLocales, alDia, deuda, premium, estandar, ingresos } };
    document.getElementById('modalCRUDContent').innerHTML = `<h3 class="text-oro text-xl font-bold mb-4">Informe MASA</h3><pre class="bg-black p-4 rounded-xl text-xs">${JSON.stringify(informe, null, 2)}</pre><div class="flex gap-2 mt-4"><button class="btn-oro flex-1 py-2 rounded-xl" onclick="navigator.clipboard.writeText(document.querySelector('#modalCRUDContent pre').innerText); toast('Copiado');">Copiar</button><button class="bg-slate-600 flex-1 py-2 rounded-xl" onclick="cerrarModal('modalCRUD')">Cerrar</button></div>`;
    mostrarModal('modalCRUD');
}

        <input type="text" id="prodNombre" value="${prod?.nombre||''}" placeholder="Nombre" class="w-full bg-slate-700 rounded-lg p-2" required>
        <input type="text" id="prodDesc" value="${prod?.descripcion||''}" placeholder="Descripción" class="w-full bg-slate-700 rounded-lg p-2">
        <input type="number" id="prodPrecio" value="${prod?.precio||0}" placeholder="Precio (Gs)" class="w-full bg-slate-700 rounded-lg p-2">
        <input type="text" id="prodCategoria" value="${prod?.categoria||''}" placeholder="Categoría" class="w-full bg-slate-700 rounded-lg p-2">
        <input type="text" id="prodImagen" value="${prod?.imagen||''}" placeholder="URL imagen o emoji" class="w-full bg-slate-700 rounded-lg p-2">
        <input type="file" id="prodImagenFile" accept="image/*" class="w-full bg-slate-700 p-1 rounded">
        <div class="flex gap-2"><button type="submit" class="btn-oro flex-1 py-2 rounded-xl">Guardar</button><button type="button" onclick="cerrarModal('modalCRUD')" class="bg-slate-600 flex-1 py-2 rounded-xl">Cancelar</button></div>
    </form>`;
    mostrarModal('modalCRUD');
}
function guardarProducto(e, id) { e.preventDefault(); const local = obtenerLocalActual(); const nombre = document.getElementById('prodNombre').value.trim(); const desc = document.getElementById('prodDesc').value.trim(); const precio = parseInt(document.getElementById('prodPrecio').value) || 0; const categoria = document.getElementById('prodCategoria').value.trim(); let imagen = document.getElementById('prodImagen').value.trim(); const file = document.getElementById('prodImagenFile').files[0]; if (file) convertirImagenABase64(file, (base64) => { imagen = base64; guardar(); }); else guardar(); function guardar() { if (id) { let p = local.productos.find(p => p.id === id); if (p) { p.nombre = nombre; p.descripcion = desc; p.precio = precio; p.categoria = categoria; if(imagen) p.imagen = imagen; } } else { local.productos.push({ id: 'prod_'+Date.now(), nombre, descripcion: desc, precio, categoria, imagen }); } guardarDatos(); cerrarModal('modalCRUD'); renderProductos(); toast('Producto guardado'); } }
function eliminarProducto(id) { if(confirm('¿Eliminar producto?')) { let local = obtenerLocalActual(); local.productos = local.productos.filter(p => p.id !== id); guardarDatos(); renderProductos(); toast('Eliminado'); } }

function abrirModalLocalPropio() {
    const local = obtenerLocalActual();
    const hoy = new Date().toISOString().split('T')[0];
    const tieneEx = local.excepcionFecha === hoy;
    const modal = document.getElementById('modalCRUDContent');
    modal.innerHTML = `<h3 class="text-oro text-xl font-bold mb-4">✏️ Editar mi local</h3>
    <form onsubmit="guardarLocalPropio(event)" class="space-y-3">
        <input type="text" id="propNombre" value="${local.nombre}" class="w-full bg-slate-700 rounded-lg p-2" required>
        <input type="text" id="propRubro" value="${local.rubro}" class="w-full bg-slate-700 rounded-lg p-2">
        <select id="propCategoria" class="w-full bg-slate-700 rounded-lg p-2"><option value="PREMIUM" ${local.categoria==='PREMIUM'?'selected':''}>PREMIUM</option><option value="ESTANDAR" ${local.categoria==='ESTANDAR'?'selected':''}>ESTÁNDAR</option></select>
        <input type="text" id="propHorario" value="${local.horario}" placeholder="Horario" class="w-full bg-slate-700 rounded-lg p-2">
        <input type="text" id="propTelefono" value="${local.telefono||''}" placeholder="Teléfono" class="w-full bg-slate-700 rounded-lg p-2">
        <input type="text" id="propFoto" value="${local.foto}" placeholder="Foto URL" class="w-full bg-slate-700 rounded-lg p-2">
        <input type="file" id="propFotoFile" accept="image/*" class="w-full bg-slate-700 p-1 rounded">
        <div class="border-t pt-2"><p class="text-oro">Excepción para hoy (${hoy})</p><label><input type="checkbox" id="propCerradoHoy" ${tieneEx && local.excepcionCerrado ? 'checked' : ''}> Cerrado hoy</label><input type="text" id="propHorarioHoy" placeholder="Horario especial" value="${tieneEx && !local.excepcionCerrado ? (local.excepcionHorario||'') : ''}" class="w-full bg-slate-700 rounded-lg p-2 mt-2"></div>
        <div class="flex gap-2"><button type="submit" class="btn-oro flex-1 py-2 rounded-xl">Guardar</button><button type="button" onclick="cerrarModal('modalCRUD')" class="bg-slate-600 flex-1 py-2 rounded-xl">Cancelar</button></div>
    </form>`;
    mostrarModal('modalCRUD');
}
function guardarLocalPropio(e) { e.preventDefault(); const local = obtenerLocalActual(); local.nombre = document.getElementById('propNombre').value.trim(); local.rubro = document.getElementById('propRubro').value.trim(); local.categoria = document.getElementById('propCategoria').value; local.horario = document.getElementById('propHorario').value.trim(); local.telefono = document.getElementById('propTelefono').value.trim(); let foto = document.getElementById('propFoto').value.trim(); const file = document.getElementById('propFotoFile').files[0]; const hoy = new Date().toISOString().split('T')[0]; const cerrado = document.getElementById('propCerradoHoy').checked; const horarioHoy = document.getElementById('propHorarioHoy').value.trim(); if (file) convertirImagenABase64(file, (base64) => { local.foto = base64; guardar(); }); else { local.foto = foto; guardar(); } function guardar() { if (cerrado || horarioHoy) { local.excepcionFecha = hoy; local.excepcionCerrado = cerrado; local.excepcionHorario = horarioHoy; } else { delete local.excepcionFecha; delete local.excepcionCerrado; delete local.excepcionHorario; } guardarDatos(); cerrarModal('modalCRUD'); renderProductos(); toast('Local actualizado'); } }

function ejecutarConfirmacion() { if (window._confirmAction) window._confirmAction(); window._confirmAction = null; cerrarModal('modalConfirm'); }

// ======================== INICIALIZACIÓN ========================
function init() {
    if (!localStorage.getItem('golcentral_datos')) guardarDatos();
    else cargarDatos();
    cargarCarrito();
    const urlParams = new URLSearchParams(window.location.search);
    const localId = urlParams.get('local');
    if (localId) {
        for(let p of datos.paises) for(let c of p.ciudades) for(let ce of c.centros) for(let l of ce.locales) {
            if (l.id === localId) { navegacion = { paisId: p.id, ciudadId: c.id, centroId: ce.id, localId }; renderProductos(); return; }
        }
    }
    volverAInicio();
}
document.addEventListener('DOMContentLoaded', init);
</script>
